[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "quantcore-portfolio"
version = "0.1.0"
description = "Offline systematic trading infrastructure demonstration"
requires-python = ">=3.11"
dependencies = []
[tool.setuptools.packages.find]
include = ["quantcore*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
